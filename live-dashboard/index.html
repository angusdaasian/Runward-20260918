<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>RunWard · Live Data</title>
<style>
  :root {
    --bg:#f6f8fb; --card:#ffffff; --line:#e6eaf0; --line-soft:#eef1f6;
    --fg:#182230; --mut:#697386; --faint:#9aa4b5;
    --ok:#16a34a; --ok-soft:#e8f7ee;
    --warn:#d97706; --warn-soft:#fdf3e3;
    --bad:#dc2626; --bad-soft:#fdecec;
    --acc:#3b82f6; --acc-soft:#eaf2fe;
    --shadow:0 1px 2px rgba(24,34,48,.04), 0 4px 16px rgba(24,34,48,.05);
    --shadow-lift:0 2px 4px rgba(24,34,48,.06), 0 8px 24px rgba(24,34,48,.08);
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased; }
  header { display:flex; align-items:center; gap:12px; padding:14px 28px; position:sticky; top:0; background:rgba(255,255,255,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); z-index:2; }
  header .mark { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; letter-spacing:-.5px; }
  h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:-.2px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--faint); flex:none; }
  .dot.live { background:var(--ok); animation:pulse 2s infinite; }
  .dot.err { background:var(--bad); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(22,163,74,.45)} 70%{box-shadow:0 0 0 8px rgba(22,163,74,0)} 100%{box-shadow:0 0 0 0 rgba(22,163,74,0)} }
  .mut { color:var(--mut); }
  .status-label { font-size:12.5px; }
  main { display:grid; grid-template-columns: 340px 1fr; gap:20px; padding:24px 28px; max-width:1500px; margin:0 auto; }
  @media (max-width:1000px){ main{grid-template-columns:1fr} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); }
  .sum { display:grid; gap:12px; align-content:start; }
  .sum .card h3 { margin:0 0 10px; font-size:13.5px; font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .badge { font-size:11px; font-weight:500; padding:2px 9px; border-radius:99px; white-space:nowrap; }
  .badge.fresh { color:var(--ok); background:var(--ok-soft); }
  .badge.stale { color:var(--warn); background:var(--warn-soft); }
  .w { display:flex; justify-content:space-between; font-size:12.5px; color:var(--mut); padding:3px 0; }
  .watches { border-top:1px dashed var(--line); margin-top:8px; padding-top:6px; }
  .panel { padding:0; overflow:hidden; display:flex; flex-direction:column; }
  .panel-inner { padding:18px 20px 14px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
  .stat { background:var(--bg); border:1px solid var(--line-soft); border-radius:12px; padding:12px 16px; }
  .stat b { font-size:24px; font-weight:700; display:block; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
  .stat span { font-size:12px; color:var(--mut); }
  .filters { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filters button { background:transparent; color:var(--mut); border:1px solid var(--line); border-radius:99px; padding:5px 14px; cursor:pointer; font-size:12.5px; font-weight:500; transition:all .15s; }
  .filters button:hover { border-color:var(--faint); color:var(--fg); }
  .filters button.on { color:#fff; background:var(--fg); border-color:var(--fg); }
  .tablewrap { overflow:auto; max-height:calc(100vh - 120px); border-top:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  th { color:var(--faint); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; position:sticky; top:0; background:var(--card); z-index:1; }
  tbody tr:hover { background:#fafbfd; }
  td b { font-weight:600; }
  tr.new { animation:flash 2.5s ease-out; }
  @keyframes flash { from { background:var(--acc-soft);} to { background:transparent; } }
  .k { font-size:11px; font-weight:600; padding:2px 9px; border-radius:99px; display:inline-block; }
  .k.webhook { color:var(--acc); background:var(--acc-soft); }
  .k.activity { color:var(--ok); background:var(--ok-soft); }
  .k.daily { color:var(--warn); background:var(--warn-soft); }
  .bad { color:var(--bad); }
  .empty { padding:48px 20px; text-align:center; }
  form { max-width:360px; margin:14vh auto; display:grid; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px 28px; box-shadow:var(--shadow-lift); }
  form h1 { font-size:18px; }
  form .sub { margin:-4px 0 8px; }
  input { background:var(--bg); border:1px solid var(--line); color:var(--fg); padding:11px 12px; border-radius:10px; font-size:14px; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus { border-color:var(--acc); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  .btn { background:var(--acc); color:#fff; border:0; padding:11px; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer; transition:background .15s; }
  .btn:hover { background:#2563eb; }
  .link { background:none; border:0; color:var(--mut); cursor:pointer; margin-left:auto; font-size:13px; padding:6px 10px; border-radius:8px; }
  .link:hover { color:var(--fg); background:var(--line-soft); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.49.1";
const sb = createClient("https://kbghvclwhxnjeskdodeh.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiZ2h2Y2x3aHhuamVza2RvZGVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNTE0MDQsImV4cCI6MjA5MDkyNzQwNH0.ymRqbqpdRssDmDI_zCWsKNFKAOQGfns76JnSmTsIaBM");

const NAMES = { stridee:"Stridee", terra:"Terra", railway:"Railway (Garmin)", strava:"Strava", suunto:"Suunto", intervals:"Intervals.icu", apple:"Apple Watch", polar:"Polar", watch:"Watch daily" };
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&#38;","<":"&#60;",">":"&#62;",'"':"&#34;" }[c]));
const ago = (s) => { if (!s) return "never"; const m = Math.round((Date.now()-new Date(s))/60000); return m<1?"just now":m<60?`${m}m ago`:m<2880?`${Math.round(m/60)}h ago`:`${Math.round(m/1440)}d ago`; };
const time = (s) => new Date(s).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", second:"2-digit" });

let events = [], seen = new Set(), cursor = null, filter = "all", summary = [], status = "", timers = [];

function login(msg = "") {
  timers.forEach(clearInterval); timers = [];
  app.innerHTML = `<form id="f"><h1>RunWard · Live Data</h1><p class="mut sub">Admin sign-in</p>
    <input id="e" type="email" placeholder="Email" required><input id="p" type="password" placeholder="Password" required>
    <button class="btn">Sign in</button><p class="bad">${esc(msg)}</p></form>`;
  document.getElementById("f").onsubmit = async (ev) => {
    ev.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: e.value, password: p.value });
    if (error) return login(error.message);
    const d = await isAdmin();
    if (d) start(d);
    else { await sb.auth.signOut(); login("This account is not an admin."); }
  };
}

async function isAdmin() {
  const { data, error } = await sb.functions.invoke("admin-live-feed", { body: { since: null } });
  if (error || data?.error) return null;
  return data;
}

async function poll() {
  const { data, error } = await sb.functions.invoke("admin-live-feed", { body: { since: cursor } });
  if (error || data?.error) { status = "err"; render(); if (String(data?.error ?? "").includes("Admin")) { await sb.auth.signOut(); login("This account is not an admin."); } return; }
  status = "live"; cursor = data.now;
  const fresh = data.events.filter((x) => !seen.has(x.id));
  fresh.forEach((x) => { seen.add(x.id); x._new = events.length > 0; });
  events = [...fresh, ...events].sort((a,b) => b.at.localeCompare(a.at)).slice(0, 500);
  if (fresh.length && document.hidden) document.title = `(${fresh.length}) RunWard · Live Data`;
  render();
}
async function loadSummary() {
  const { data } = await sb.functions.invoke("admin-data-status", { body: { limit: 50 } });
  if (data?.summary) { summary = data.summary; render(); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = "RunWard · Live Data"; });

function render() {
  const lastHour = events.filter((x) => Date.now() - new Date(x.at) < 3600_000);
  const shown = events.filter((x) => filter === "all" || x.kind === filter || x.source === filter);
  const sumHtml = summary.map((s) => {
    const last = [s.last_activity, s.last_daily].filter(Boolean).sort().pop();
    const freshCls = last && Date.now()-new Date(last) < 3*3600_000 ? "fresh" : "stale";
    const watches = (s.watches||[]);
    return `<div class="card"><h3>${esc(NAMES[s.source] ?? s.source)}<span class="badge ${freshCls}">${ago(last)}</span></h3>
      <div class="w"><span>Activities</span><b>${s.activities}</b></div>
      <div class="w"><span>Daily health</span><b>${s.daily}</b></div>
      ${watches.length ? `<div class="watches">${watches.map((w) => `<div class="w"><span>${esc(w.watch)}</span><span>${w.activities} act · ${w.daily} daily · ${ago(w.last_activity)}</span></div>`).join("")}</div>` : ""}</div>`;
  }).join("") || `<p class="mut">Loading totals…</p>`;
  const f = ["all","webhook","activity","daily","stridee","terra","railway","strava","suunto","intervals","apple","polar"];
  app.innerHTML = `<header><span class="mark">R</span><h1>RunWard · Live Data</h1>
    <span class="dot ${status}"></span><span class="mut status-label">${status === "live" ? "Live · updates every 5 s" : status === "err" ? "Connection problem, retrying…" : "Connecting…"}</span>
    <button class="link" id="out">Sign out</button></header>
    <main><section class="sum">${sumHtml}</section>
    <section class="card panel">
      <div class="panel-inner">
        <div class="stats">
          <div class="stat"><b>${lastHour.length}</b><span>items last hour</span></div>
          <div class="stat"><b>${lastHour.filter((x)=>x.kind==="webhook").length}</b><span>webhooks last hour</span></div>
          <div class="stat"><b class="${lastHour.some((x)=>!x.ok)?"bad":""}">${lastHour.filter((x)=>!x.ok).length}</b><span>errors last hour</span></div></div>
        <div class="filters">${f.map((k) => `<button data-f="${k}" class="${filter===k?"on":""}">${k === "all" ? "All" : NAMES[k] ?? k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>
      </div>
      <div class="tablewrap">
      <table><thead><tr><th>Time</th><th>Type</th><th>Provider</th><th>Watch</th><th>User</th><th>Details</th></tr></thead><tbody>
      ${shown.map((x) => `<tr class="${x._new?"new":""}"><td class="mut">${time(x.at)}<br><small>${ago(x.at)}</small></td>
        <td><span class="k ${x.kind}">${x.kind}</span></td><td>${esc(NAMES[x.source] ?? x.source)}</td><td>${esc(x.watch ?? "—")}</td>
        <td>${esc(x.user_name || (x.user_id ? x.user_id.slice(0,8) : "—"))}</td>
        <td><b>${esc(x.title)}</b> <span class="mut">${esc(x.detail)}</span>${x.error ? `<div class="bad">${esc(x.error)}</div>` : ""}</td></tr>`).join("")
        || `<tr><td colspan="6"><div class="empty mut">Nothing received in the last 6 hours yet — new data will appear here automatically.</div></td></tr>`}
      </tbody></table></div></section></main>`;
  events.forEach((x) => (x._new = false));
  document.getElementById("out").onclick = async () => { await sb.auth.signOut(); login(); };
  app.querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => { filter = b.dataset.f; render(); }));
}

function start() {
  render(); poll(); loadSummary();
  timers.push(setInterval(poll, 5000), setInterval(loadSummary, 60000), setInterval(render, 30000));
}
const { data: { session } } = await sb.auth.getSession();
if (session && await isAdmin()) start();
else { if (session) await sb.auth.signOut(); login(session ? "This account is not an admin." : ""); }
</script>
</body>
</html>
