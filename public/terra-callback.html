<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finalizing connection…</title>
    <style>
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #555;
        font-size: 14px;
        text-align: center;
        padding: 24px;
      }
      .box { max-width: 320px; }
      h1 { font-size: 18px; margin: 8px 0 6px; color: #111; }
      p { margin: 4px 0; color: #666; }
    </style>
  </head>
  <body>
    <div class="box">
      <div style="font-size: 28px;">✅</div>
      <h1 id="title">Connected</h1>
      <p id="msg">You may now close this browser.</p>
    </div>
    <script>
      (function () {
        var qs = new URLSearchParams(window.location.search);
        var scheme = qs.get("deeplink_scheme") || "runward";
        var status = (qs.get("status") || "success").toLowerCase();

        if (status !== "success") {
          document.querySelector(".box div").textContent = "⚠️";
          document.getElementById("title").textContent = "Connection failed";
          document.getElementById("msg").textContent =
            "Please return to the app and try again.";
        }

        // Forward ALL query params to the in-app deep link so the WebView
        // route can run terra-confirm with terra_user_id, reference_id, etc.
        // Despia closes the in-app browser when it sees `<scheme>://oauth/...`
        // and navigates the main WebView to /terra-return?<params>.
        var forwarded = new URLSearchParams();
        qs.forEach(function (value, key) {
          if (key === "deeplink_scheme") return;
          forwarded.set(key, value);
        });
        // Ensure terra=success|failure is set so ConnectApps' query-param
        // handler also fires when the user lands back on the main route.
        forwarded.set("terra", status);

        var deepLink =
          scheme + "://oauth/terra-return?" + forwarded.toString();

        // Give the UI a beat so the user sees "Connected" briefly even on
        // very fast devices, then trigger the close+navigate.
        setTimeout(function () {
          window.location.href = deepLink;
        }, 250);
      })();
    </script>
  </body>
</html>
