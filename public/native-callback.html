<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Completing sign in…</title>
    <style>
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #888;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <p>Completing sign in…</p>
    <script>
      (function () {
        var qs = new URLSearchParams(window.location.search);
        var scheme = qs.get("deeplink_scheme");
        if (!scheme) {
          console.error("[native-callback] missing deeplink_scheme");
          return;
        }

        var hash = new URLSearchParams(window.location.hash.substring(1));
        var accessToken = hash.get("access_token");
        var refreshToken = hash.get("refresh_token") || "";
        var error = hash.get("error") || qs.get("error");

        if (!accessToken) {
          window.location.href =
            scheme +
            "://oauth/auth?error=" +
            encodeURIComponent(error || "no_access_token");
          return;
        }

        // The `oauth/` prefix tells Despia to close the secure browser
        // session and navigate the WebView to /auth?access_token=...
        window.location.href =
          scheme +
          "://oauth/auth" +
          "?access_token=" +
          encodeURIComponent(accessToken) +
          "&refresh_token=" +
          encodeURIComponent(refreshToken);
      })();
    </script>
  </body>
</html>
