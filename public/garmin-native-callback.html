<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garmin sign-in</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 24px; background: #0a0a0a; color: #fafafa; }
      .card { max-width: 480px; margin: 40px auto; padding: 20px; border: 1px solid #262626; border-radius: 12px; background: #171717; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      pre { font-size: 11px; white-space: pre-wrap; word-break: break-all; color: #a3a3a3; margin: 0; }
      .ok { color: #4ade80; }
      .err { color: #f87171; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="status">Processing Garmin sign-in…</h1>
      <pre id="diag"></pre>
    </div>
    <script>
      (function () {
        var statusEl = document.getElementById("status");
        var diagEl = document.getElementById("diag");

        var params = new URLSearchParams(window.location.search);
        var ticket = params.get("ticket") || params.get("serviceTicket");
        var error = params.get("error") || params.get("errorMessage") || "";
        var deeplinkScheme = params.get("deeplinkScheme") || "runward";

        // Canonical service URL — must match exactly what garmin-sso-start registered.
        var origin = window.location.origin;
        var canonicalServiceUrl = origin + "/garmin-native-callback.html?deeplinkScheme=" + encodeURIComponent(deeplinkScheme);

        var target = new URL(deeplinkScheme + "://oauth/garmin-mobile-auth");

        if (ticket) {
          target.searchParams.set("ticket", ticket);
          statusEl.textContent = "Ticket received ✅";
          statusEl.className = "ok";
        } else if (error) {
          target.searchParams.set("error", error);
          statusEl.textContent = "Garmin returned an error";
          statusEl.className = "err";
        } else {
          target.searchParams.set("error", "No sign-in ticket received");
          statusEl.textContent = "No ticket received";
          statusEl.className = "err";
        }
        target.searchParams.set("serviceUrl", canonicalServiceUrl);

        diagEl.textContent =
          "Ticket: " + (ticket ? ticket.substring(0, 20) + "…" : "(none)") + "\n" +
          "Service URL: " + canonicalServiceUrl + "\n" +
          "Redirecting to: " + deeplinkScheme + "://oauth/garmin-mobile-auth";

        // Brief delay so users (and screenshots) can see the status before the deeplink fires.
        setTimeout(function () {
          window.location.replace(target.toString());
        }, 600);
      })();
    </script>
  </body>
</html>
